<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Japanese Recipes for Mom</title>
<style>
  :root {
    --bg: #f8f1de;
    --paper: #fffdf7;
    --ink: #1c2b39;
    --ink-soft: #3d4f5e;
    --muted: #6b6355;
    --accent: #b54a2c;
    --accent-dark: #963c22;
    --accent2: #5c7a5e;
    --border: #e4d9c0;
    --optional-bg: #f0e6c8;
    --optional-ink: #7a5c1e;
    --shadow: 0 2px 10px rgba(28,43,57,0.08);
    --shadow-lg: 0 8px 28px rgba(28,43,57,0.14);
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  h1, h2, h3, .serif {
    font-family: Georgia, "Iowan Old Style", "Noto Serif", "Times New Roman", serif;
  }

  a { color: var(--accent-dark); }

  /* ---------- Header ---------- */
  .topbar {
    position: sticky;
    top: 0;
    z-index: 50;
    background: var(--ink);
    color: #f5efe0;
    padding: 10px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }

  .lang-toggle {
    display: flex;
    background: rgba(255,255,255,0.12);
    border-radius: 999px;
    padding: 3px;
    gap: 2px;
    flex-shrink: 0;
  }

  .lang-btn {
    border: none;
    background: transparent;
    color: #cfd6dc;
    font-size: 13px;
    font-weight: 600;
    padding: 6px 12px;
    border-radius: 999px;
    cursor: pointer;
    transition: background 0.2s, color 0.2s;
    letter-spacing: 0.02em;
  }

  .lang-btn.active {
    background: var(--accent);
    color: #fff;
  }

  .topbar-title {
    font-size: 15px;
    font-weight: 600;
    color: #f5efe0;
    text-align: center;
    flex: 1;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-family: Georgia, "Noto Serif", serif;
    letter-spacing: 0.01em;
  }

  .topbar-spacer { width: 78px; flex-shrink: 0; }

  /* ---------- Hero ---------- */
  .hero {
    padding: 34px 20px 22px;
    text-align: center;
    max-width: 760px;
    margin: 0 auto;
  }

  .hero h1 {
    font-size: clamp(28px, 5vw, 40px);
    margin: 0 0 10px;
    color: var(--ink);
    line-height: 1.15;
  }

  .hero p {
    color: var(--muted);
    font-size: 16px;
    line-height: 1.55;
    margin: 0 auto;
    max-width: 560px;
  }

  /* ---------- Category tabs ---------- */
  .tabs-wrap {
    max-width: 760px;
    margin: 22px auto 0;
    padding: 0 20px;
  }

  .tabs {
    display: flex;
    background: var(--paper);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 5px;
    gap: 5px;
    box-shadow: var(--shadow);
  }

  .tab-btn {
    flex: 1;
    border: none;
    background: transparent;
    padding: 12px 10px;
    border-radius: 10px;
    font-size: 15px;
    font-weight: 600;
    color: var(--ink-soft);
    cursor: pointer;
    transition: background 0.2s, color 0.2s;
    font-family: Georgia, "Noto Serif", serif;
  }

  .tab-btn.active {
    background: var(--ink);
    color: #f8f1de;
  }

  .tab-count {
    display: block;
    font-size: 12px;
    font-weight: 400;
    opacity: 0.75;
    margin-top: 2px;
    font-family: -apple-system, sans-serif;
  }

  /* ---------- Search ---------- */
  .search-wrap {
    max-width: 760px;
    margin: 14px auto 0;
    padding: 0 20px;
  }

  .search-input {
    width: 100%;
    padding: 13px 16px;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: var(--paper);
    font-size: 15px;
    color: var(--ink);
    font-family: inherit;
  }
  .search-input:focus { outline: 2px solid var(--accent2); outline-offset: 1px; }

  /* ---------- Grid ---------- */
  .grid-wrap {
    max-width: 1080px;
    margin: 24px auto 60px;
    padding: 0 20px;
  }

  .result-count {
    color: var(--muted);
    font-size: 14px;
    margin-bottom: 14px;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 16px;
  }

  .card {
    background: var(--paper);
    border: 1px solid var(--border);
    border-radius: 16px;
    box-shadow: var(--shadow);
    overflow: hidden;
    transition: box-shadow 0.2s, transform 0.15s;
  }
  .card:hover { box-shadow: var(--shadow-lg); }

  .card-head {
    padding: 18px 18px 14px;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .card-name {
    font-size: 18px;
    font-weight: 700;
    line-height: 1.3;
    color: var(--ink);
    font-family: Georgia, "Noto Serif", serif;
  }

  .card-time {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 12.5px;
    color: var(--accent-dark);
    font-weight: 600;
  }

  .card-desc {
    color: var(--ink-soft);
    font-size: 14.5px;
    line-height: 1.5;
    margin: 0;
  }

  .card-toggle-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 4px;
  }

  .expand-label {
    font-size: 13px;
    font-weight: 600;
    color: var(--accent2);
    display: flex;
    align-items: center;
    gap: 5px;
  }

  .chevron {
    transition: transform 0.2s;
    display: inline-block;
  }
  .card.open .chevron { transform: rotate(180deg); }

  .card-body {
    max-height: 0;
    overflow: hidden;
    transition: max-height 0.28s ease;
    border-top: 1px solid transparent;
  }
  .card.open .card-body {
    border-top: 1px solid var(--border);
  }

  .card-body-inner {
    padding: 16px 18px 18px;
  }

  .ing-title {
    font-size: 12.5px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--muted);
    font-weight: 700;
    margin: 0 0 10px;
  }

  .ing-list {
    list-style: none;
    margin: 0 0 16px;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 7px;
  }

  .ing-item {
    font-size: 14.5px;
    line-height: 1.45;
    color: var(--ink);
    display: flex;
    align-items: baseline;
    gap: 8px;
  }

  .ing-bullet {
    color: var(--accent2);
    flex-shrink: 0;
    margin-top: 1px;
  }

  .ing-item.optional .ing-text { color: var(--ink-soft); }

  .opt-badge {
    display: inline-block;
    font-size: 10.5px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    background: var(--optional-bg);
    color: var(--optional-ink);
    padding: 1px 7px;
    border-radius: 999px;
    margin-left: 6px;
    vertical-align: middle;
    white-space: nowrap;
  }

  .card-link {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 14px;
    font-weight: 700;
    color: #fff;
    background: var(--accent);
    padding: 10px 16px;
    border-radius: 10px;
    text-decoration: none;
    transition: background 0.2s;
  }
  .card-link:hover { background: var(--accent-dark); }

  .no-results {
    text-align: center;
    padding: 60px 20px;
    color: var(--muted);
    font-size: 15px;
  }

  footer {
    text-align: center;
    color: var(--muted);
    font-size: 13px;
    padding: 20px;
  }

  @media (max-width: 480px) {
    .topbar-title { font-size: 13px; }
    .hero h1 { font-size: 26px; }
    .tab-btn { font-size: 13.5px; padding: 10px 6px; }
  }

  /* ---------- Add to list button ---------- */
  .card-actions {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-top: 2px;
  }

  .add-list-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    font-weight: 700;
    padding: 8px 13px;
    border-radius: 9px;
    border: 1.5px solid var(--accent2);
    background: transparent;
    color: var(--accent2);
    cursor: pointer;
    transition: background 0.2s, color 0.2s;
    white-space: nowrap;
  }

  .add-list-btn:hover { background: rgba(92,122,94,0.1); }

  .add-list-btn.selected {
    background: var(--accent2);
    color: #fff;
  }

  /* ---------- Floating shopping list button ---------- */
  .fab-cart {
    position: fixed;
    bottom: 22px;
    right: 22px;
    z-index: 60;
    background: var(--ink);
    color: #f8f1de;
    border: none;
    border-radius: 999px;
    padding: 14px 20px;
    font-size: 15px;
    font-weight: 700;
    display: flex;
    align-items: center;
    gap: 9px;
    box-shadow: var(--shadow-lg);
    cursor: pointer;
    transition: transform 0.15s;
  }
  .fab-cart:hover { transform: translateY(-2px); }
  .fab-cart.hidden { display: none; }

  .fab-badge {
    background: var(--accent);
    color: #fff;
    border-radius: 999px;
    min-width: 22px;
    height: 22px;
    padding: 0 6px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 12.5px;
    font-weight: 800;
  }

  /* ---------- Shopping list panel ---------- */
  .panel-overlay {
    position: fixed;
    inset: 0;
    background: rgba(28,43,57,0.45);
    z-index: 100;
    display: none;
  }
  .panel-overlay.open { display: block; }

  .panel {
    position: fixed;
    top: 0;
    right: 0;
    height: 100%;
    width: min(420px, 100%);
    background: var(--bg);
    box-shadow: -8px 0 30px rgba(0,0,0,0.2);
    z-index: 101;
    transform: translateX(100%);
    transition: transform 0.25s ease;
    display: flex;
    flex-direction: column;
  }
  .panel.open { transform: translateX(0); }

  .panel-header {
    background: var(--ink);
    color: #f8f1de;
    padding: 18px 18px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
  }

  .panel-header h2 {
    margin: 0;
    font-size: 19px;
  }

  .panel-close {
    background: rgba(255,255,255,0.12);
    border: none;
    color: #f8f1de;
    width: 32px;
    height: 32px;
    border-radius: 999px;
    font-size: 18px;
    cursor: pointer;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .panel-body {
    flex: 1;
    overflow-y: auto;
    padding: 16px 18px 100px;
  }

  .panel-toolbar {
    display: flex;
    justify-content: flex-end;
    margin-bottom: 12px;
  }

  .clear-all-btn {
    background: none;
    border: none;
    color: var(--accent-dark);
    font-size: 13.5px;
    font-weight: 700;
    cursor: pointer;
    padding: 4px 0;
  }

  .selected-chips {
    display: flex;
    flex-wrap: wrap;
    gap: 7px;
    margin-bottom: 18px;
  }

  .chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: var(--paper);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 6px 8px 6px 13px;
    font-size: 13px;
    font-weight: 600;
    color: var(--ink-soft);
  }

  .chip-remove {
    background: var(--border);
    border: none;
    border-radius: 999px;
    width: 19px;
    height: 19px;
    font-size: 12px;
    line-height: 1;
    cursor: pointer;
    color: var(--ink);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .shop-group {
    margin-bottom: 16px;
    background: var(--paper);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 13px 15px;
  }

  .shop-group-name {
    font-weight: 700;
    font-size: 15px;
    color: var(--ink);
    margin-bottom: 8px;
    font-family: Georgia, "Noto Serif", serif;
  }

  .shop-line {
    display: flex;
    align-items: baseline;
    gap: 6px;
    font-size: 14px;
    color: var(--ink-soft);
    padding: 3px 0;
  }

  .shop-line .amt { font-weight: 700; color: var(--ink); }
  .shop-line .for-recipe { font-size: 12.5px; color: var(--muted); }

  .panel-empty {
    text-align: center;
    color: var(--muted);
    padding: 60px 20px;
    font-size: 14.5px;
    line-height: 1.6;
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="lang-toggle" role="group" aria-label="Language switch">
    <button class="lang-btn active" id="btn-en" onclick="setLang('en')">EN</button>
    <button class="lang-btn" id="btn-cz" onclick="setLang('cz')">CZ</button>
  </div>
  <div class="topbar-title" id="t-topbar-title">Japanese Recipes</div>
  <div class="topbar-spacer"></div>
</div>

<div class="hero">
  <h1 id="t-hero-title">Quick &amp; Easy Japanese Recipes</h1>
  <p id="t-hero-sub">A hand-picked collection with ingredients ready to check at a glance — no need to open every recipe one by one.</p>
</div>

<div class="tabs-wrap">
  <div class="tabs" role="tablist">
    <button class="tab-btn active" id="tab-quick" onclick="setCategory('quick')">
      <span id="t-tab-quick">Quick &amp; Easy</span>
      <span class="tab-count" id="t-tab-quick-count">35 recipes</span>
    </button>
    <button class="tab-btn" id="tab-bento" onclick="setCategory('bento')">
      <span id="t-tab-bento">Bento</span>
      <span class="tab-count" id="t-tab-bento-count">10 recipes</span>
    </button>
  </div>
</div>

<div class="search-wrap">
  <input type="text" class="search-input" id="search-input" placeholder="Search recipes or ingredients…" oninput="renderGrid()">
</div>

<div class="grid-wrap">
  <div class="result-count" id="result-count"></div>
  <div class="grid" id="grid"></div>
  <div class="no-results" id="no-results" style="display:none;"></div>
</div>

<footer id="t-footer">Recipes curated from justonecookbook.com — tap a card to see ingredients, then open the original for full instructions.</footer>

<button class="fab-cart hidden" id="fab-cart" onclick="openPanel()">
  🛒 <span id="t-fab-label">Shopping List</span> <span class="fab-badge" id="fab-badge">0</span>
</button>

<div class="panel-overlay" id="panel-overlay" onclick="closePanel()"></div>
<div class="panel" id="panel">
  <div class="panel-header">
    <h2 id="t-panel-title">Shopping List</h2>
    <button class="panel-close" onclick="closePanel()">✕</button>
  </div>
  <div class="panel-body" id="panel-body"></div>
</div>

let state = {
  lang: 'en',
  category: 'quick',
  openCards: new Set(),
  selected: new Set(),
  panelOpen: false
};

function setLang(lang) {
  state.lang = lang;
  document.getElementById('btn-en').classList.toggle('active', lang === 'en');
  document.getElementById('btn-cz').classList.toggle('active', lang === 'cz');
  document.documentElement.lang = lang === 'cz' ? 'cs' : 'en';
  applyStaticText();
  renderGrid();
}

function setCategory(cat) {
  state.category = cat;
  state.openCards = new Set();
  document.getElementById('tab-quick').classList.toggle('active', cat === 'quick');
  document.getElementById('tab-bento').classList.toggle('active', cat === 'bento');
  applyStaticText();
  renderGrid();
}

function applyStaticText() {
  const t = TR[state.lang];
  document.getElementById('t-topbar-title').textContent = t.topbarTitle;
  document.getElementById('t-hero-title').textContent = state.category === 'quick' ? t.heroTitleQuick : t.heroTitleBento;
  document.getElementById('t-hero-sub').textContent = t.heroSub;
  document.getElementById('t-tab-quick').textContent = t.tabQuick;
  document.getElementById('t-tab-bento').textContent = t.tabBento;
  document.getElementById('t-tab-quick-count').textContent = RECIPE_DATA.quick.length + ' ' + t.recipesWord;
  document.getElementById('t-tab-bento-count').textContent = RECIPE_DATA.bento.length + ' ' + t.recipesWord;
  document.getElementById('search-input').placeholder = t.searchPlaceholder;
  document.getElementById('t-footer').textContent = t.footer;
  document.getElementById('t-fab-label').textContent = t.fabLabel;
  document.getElementById('t-panel-title').textContent = t.panelTitle;
  if (state.panelOpen) renderPanel();
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function matchesSearch(recipe, query) {
  if (!query) return true;
  const q = query.toLowerCase();
  const nameEn = recipe.name_en.toLowerCase();
  const nameCz = recipe.name_cz.toLowerCase();
  const descEn = recipe.desc_en.toLowerCase();
  const descCz = recipe.desc_cz.toLowerCase();
  if (nameEn.includes(q) || nameCz.includes(q) || descEn.includes(q) || descCz.includes(q)) return true;
  return recipe.ingredients.some(ing =>
    ing.en.toLowerCase().includes(q) || ing.cz.toLowerCase().includes(q)
  );
}

function toggleCard(idx) {
  if (state.openCards.has(idx)) {
    state.openCards.delete(idx);
  } else {
    state.openCards.add(idx);
  }
  renderGrid();
}

function recipeKey(category, idx) {
  return category + '_' + idx;
}

function toggleShoppingItem(category, idx) {
  const key = recipeKey(category, idx);
  if (state.selected.has(key)) {
    state.selected.delete(key);
  } else {
    state.selected.add(key);
  }
  updateFab();
  renderGrid();
  if (state.panelOpen) renderPanel();
}

function updateFab() {
  const fab = document.getElementById('fab-cart');
  const badge = document.getElementById('fab-badge');
  const count = state.selected.size;
  badge.textContent = count;
  fab.classList.toggle('hidden', count === 0 && !state.panelOpen);
}

function openPanel() {
  state.panelOpen = true;
  document.getElementById('panel').classList.add('open');
  document.getElementById('panel-overlay').classList.add('open');
  renderPanel();
}

function closePanel() {
  state.panelOpen = false;
  document.getElementById('panel').classList.remove('open');
  document.getElementById('panel-overlay').classList.remove('open');
  updateFab();
}

function clearAllSelected() {
  state.selected.clear();
  updateFab();
  renderGrid();
  renderPanel();
}

function removeSelected(key) {
  state.selected.delete(key);
  updateFab();
  renderGrid();
  renderPanel();
}

function getSelectedRecipes() {
  return Array.from(state.selected).map(key => {
    const underscoreIdx = key.lastIndexOf('_');
    const category = key.substring(0, underscoreIdx);
    const idx = parseInt(key.substring(underscoreIdx + 1), 10);
    const recipe = RECIPE_DATA[category][idx];
    return { key, category, idx, recipe };
  }).filter(item => item.recipe);
}

function renderPanel() {
  const t = TR[state.lang];
  const body = document.getElementById('panel-body');
  const items = getSelectedRecipes();

  if (items.length === 0) {
    body.innerHTML = '<div class="panel-empty">' + t.panelEmpty + '</div>';
    return;
  }

  // Chips row + clear-all
  const chipsHtml = items.map(({ key, recipe }) => {
    const name = state.lang === 'en' ? recipe.name_en : recipe.name_cz;
    return '<span class="chip">' + escapeHtml(name) +
      '<button class="chip-remove" onclick="removeSelected(\'' + key + '\')" aria-label="remove">✕</button></span>';
  }).join('');

  // Group ingredients by base name (text before the en-dash separator)
  const groups = new Map(); // baseName(lower) -> { label, lines: [{detail, recipeName, opt}] }

  items.forEach(({ recipe }) => {
    const recipeName = state.lang === 'en' ? recipe.name_en : recipe.name_cz;
    recipe.ingredients.forEach(ing => {
      const text = state.lang === 'en' ? ing.en : ing.cz;
      const dashIdx = text.indexOf(' – ');
      let base, detail;
      if (dashIdx !== -1) {
        base = text.substring(0, dashIdx).trim();
        detail = text.substring(dashIdx + 3).trim();
      } else {
        base = text.trim();
        detail = '';
      }
      const key = base.toLowerCase();
      if (!groups.has(key)) {
        groups.set(key, { label: base, lines: [] });
      }
      groups.get(key).lines.push({ detail, recipeName, opt: ing.opt });
    });
  });

  // Merge identical detail+opt within a group, listing which recipes need it
  const groupsHtml = Array.from(groups.values()).map(group => {
    const merged = new Map(); // detail+opt -> [recipeNames]
    group.lines.forEach(line => {
      const mkey = line.detail + '||' + line.opt;
      if (!merged.has(mkey)) merged.set(mkey, { detail: line.detail, opt: line.opt, recipes: [] });
      merged.get(mkey).recipes.push(line.recipeName);
    });

    const linesHtml = Array.from(merged.values()).map(m => {
      const amtText = m.detail ? m.detail : '';
      const optBadge = m.opt ? '<span class="opt-badge">' + t.optional + '</span>' : '';
      const recipesText = m.recipes.length > 1
        ? t.forRecipe + ' ' + m.recipes.length + '× (' + m.recipes.join(', ') + ')'
        : t.forRecipe + ' ' + m.recipes[0];
      return '<div class="shop-line">' +
        '<span class="amt">' + (amtText ? escapeHtml(amtText) : '•') + '</span>' + optBadge +
        '</div><div class="shop-line for-recipe" style="margin-top:-4px;">' + escapeHtml(recipesText) + '</div>';
    }).join('');

    return '<div class="shop-group"><div class="shop-group-name">' + escapeHtml(group.label) + '</div>' + linesHtml + '</div>';
  }).join('');

  body.innerHTML =
    '<div class="selected-chips">' + chipsHtml + '</div>' +
    '<div class="panel-toolbar"><button class="clear-all-btn" onclick="clearAllSelected()">' + t.clearAll + '</button></div>' +
    groupsHtml;
}

function renderGrid() {
  const t = TR[state.lang];
  const list = RECIPE_DATA[state.category];
  const query = document.getElementById('search-input').value.trim();
  const filtered = list
    .map((r, i) => ({ r, i }))
    .filter(({ r }) => matchesSearch(r, query));

  const grid = document.getElementById('grid');
  const noResults = document.getElementById('no-results');
  const resultCount = document.getElementById('result-count');

  resultCount.textContent = t.resultCount(filtered.length);

  if (filtered.length === 0) {
    grid.innerHTML = '';
    noResults.style.display = 'block';
    noResults.textContent = t.noResults;
    return;
  }
  noResults.style.display = 'none';

  grid.innerHTML = filtered.map(({ r, i }) => {
    const name = state.lang === 'en' ? r.name_en : r.name_cz;
    const desc = state.lang === 'en' ? r.desc_en : r.desc_cz;
    const isOpen = state.openCards.has(i);
    const ingredientsHtml = r.ingredients.map(ing => {
      const text = state.lang === 'en' ? ing.en : ing.cz;
      const optClass = ing.opt ? ' optional' : '';
      const optBadge = ing.opt ? '<span class="opt-badge">' + t.optional + '</span>' : '';
      return '<li class="ing-item' + optClass + '"><span class="ing-bullet">•</span><span class="ing-text">' + escapeHtml(text) + optBadge + '</span></li>';
    }).join('');

    const key = recipeKey(state.category, i);
    const isSelected = state.selected.has(key);

    return (
      '<div class="card' + (isOpen ? ' open' : '') + '">' +
        '<div class="card-head" onclick="toggleCard(' + i + ')">' +
          '<div class="card-name">' + escapeHtml(name) + '</div>' +
          (r.time ? '<div class="card-time">⏱ ' + escapeHtml(r.time) + '</div>' : '') +
          '<p class="card-desc">' + escapeHtml(desc) + '</p>' +
          '<div class="card-actions">' +
            '<button class="add-list-btn' + (isSelected ? ' selected' : '') + '" onclick="event.stopPropagation(); toggleShoppingItem(\'' + state.category + '\', ' + i + ')">' +
              (isSelected ? '✓ ' + t.addedToList : '+ ' + t.addToList) +
            '</button>' +
            '<span class="expand-label">' + (isOpen ? t.hideIngredients : t.showIngredients) + ' <span class="chevron">▾</span></span>' +
          '</div>' +
        '</div>' +
        '<div class="card-body" style="max-height:' + (isOpen ? '900px' : '0') + '">' +
          '<div class="card-body-inner">' +
            '<p class="ing-title">' + t.ingredientsTitle + '</p>' +
            '<ul class="ing-list">' + ingredientsHtml + '</ul>' +
            '<a class="card-link" href="' + r.url + '" target="_blank" rel="noopener">' + t.viewOriginal + ' ↗</a>' +
          '</div>' +
        '</div>' +
      '</div>'
    );
  }).join('');
}

applyStaticText();
renderGrid();
updateFab();
</script>
</body>
</html>
